<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Orion v2 Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="container">
    <div class="orb" id="orb">
      <div class="mask"></div>
    </div>
    <h1>Orion v2 Assistant</h1>
    <div id="status">Idle</div>

    <div class="input-container">
    <textarea id="textInput" rows="2" placeholder="Type your message… (Enter to send, Shift+Enter for newline)"></textarea>
      <button onclick="sendMessage()">Send</button>
    </div>

    <button id="powerBtn">🎤 Speak</button>
    <div id="log"></div>
  </div>

  <script src="/static/app.js" defer></script>
</body>

</html>
